# Local run: `docker compose up --build`  ->  http://127.0.0.1:8000/docs
# Optional live LLM extraction: put OLLAMA_API_KEY etc. in a local .env (never committed).
services:
  api:
    build: .
    image: cti-guard:local
    ports:
      - "127.0.0.1:8000:8000"   # no authentication: keep it on loopback
    environment:
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      LLM_MODEL: ${LLM_MODEL:-gpt-oss:120b-cloud}
      OLLAMA_HOST: ${OLLAMA_HOST:-http://host.docker.internal:11434}
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:-}
      NVD_API_KEY: ${NVD_API_KEY:-}
      OTX_API_KEY: ${OTX_API_KEY:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - cti-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
    user: "1000:1000"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
volumes:
  cti-data:

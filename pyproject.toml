[project]
name = "cti-guard"
version = "0.2.0"
description = "LLM-based IOC extraction from untrusted threat-intel text, hardened against indirect prompt injection and measured against a regex baseline."
authors = [{ name = "Adrian Infantes Romero" }]
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.1",
    "requests>=2.31",
    "httpx>=0.26",
    "sqlalchemy>=2.0",
    "structlog>=24.1",
    "ollama>=0.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
]
eval = [
    "beautifulsoup4>=4.12",
    "lxml>=5",
    "defusedxml>=0.7",
]

[project.scripts]
cti-guard = "cti_guard.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cti_guard"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
    "E501",    # line length is handled by the formatter
    "UP045",   # Optional[X] is kept in legacy domain entities
    "RUF001",  # the datamark char is deliberately non-ASCII
    "RUF012",
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --cov=cti_guard --cov-report=term-missing:skip-covered"
markers = ["integration: needs a running LLM backend (skipped by default)"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["src/cti_guard"]
omit = ["*/__init__.py"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if __name__ == .__main__.:", "raise NotImplementedError"]
